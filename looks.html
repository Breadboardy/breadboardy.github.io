<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looks — pick one</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Nunito;src:url(fonts/nunito-latin.woff2) format('woff2');font-weight:400 800;font-display:swap}

*{box-sizing:border-box}
body{margin:0;background:#0e1013;color:#e8eaed;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,sans-serif;line-height:1.6}
.page{max-width:1180px;margin:0 auto;padding:40px 20px 100px}
.page>h1{font-size:30px;letter-spacing:-.03em;margin:0 0 6px}
.page>p{color:#99a1ab;margin:0 0 36px;max-width:64ch}

.look{margin-bottom:50px}
.look>header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.look>header b{font-size:16px}
.look>header .n{font:700 11px/1 ui-monospace,monospace;letter-spacing:.14em;
  border:1px solid #2b3139;border-radius:999px;padding:6px 10px;color:#7d858f}
.look>header .why{margin-left:auto;font-size:13px;color:#7d858f}
.stage{border:1px solid #242a31;border-radius:14px;overflow:hidden;padding:30px 26px 34px}

/* ═════ 1 GLASS ═════ */
.L-glass{background:linear-gradient(135deg,#dff2e6,#f6f7f5 45%,#f3ecd9);color:#141a17}
.L-glass .cat{font:600 11.5px/1 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;
  color:#55605a;padding-bottom:10px;border-bottom:1px solid rgba(22,32,28,.08);margin:26px 0 16px;
  display:flex}
.L-glass .cat:first-child{margin-top:0}
.L-glass .cat i{margin-left:auto;font-style:normal;color:#66716c}
.L-glass .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.L-glass .c{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.75);border-radius:18px;
  padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 22px -12px rgba(22,32,28,.22)}
.L-glass .art{height:72px;border-radius:12px;margin-bottom:12px;
  background:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.3) 1.4px,transparent 0) 0 0/13px 13px,
    linear-gradient(142deg,hsl(var(--h) 42% 72%),hsl(calc(var(--h) + 34) 38% 62%));background-size:13px 13px,cover}
.L-glass .c b{display:block;font-size:16px;letter-spacing:-.02em}
.L-glass .c s{display:block;text-decoration:none;font-size:13px;color:#55605a;margin-top:3px}

/* ═════ 2 INDEX ═════ */
.L-index{background:#fbfaf7;color:#16181a;font-family:Nunito,sans-serif}
.L-index .cat{font:800 13px/1 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;
  color:#9aa0a6;margin:34px 0 4px;display:flex;align-items:baseline}
.L-index .cat i{margin-left:auto;font-style:normal;letter-spacing:.06em;color:#c2c6ca}
.L-index .cat:first-child{margin-top:0}
.L-index .row{display:block}
.L-index .c{display:flex;align-items:baseline;gap:14px;padding:17px 2px;
  border-bottom:1px solid #e6e3dc;cursor:pointer}
.L-index .c:hover{padding-left:10px;transition:padding .25s}
.L-index .c b{font-size:27px;font-weight:800;letter-spacing:-.035em}
.L-index .c s{text-decoration:none;font-size:14px;color:#8a8f95;flex:1}
.L-index .c em{font-style:normal;font:700 10px/1 ui-monospace,monospace;letter-spacing:.1em;
  text-transform:uppercase;color:#b0b5ba}
.L-index .art{display:none}

/* ═════ 3 BLUEPRINT ═════ */
.L-blue{background:#0a1420;color:#cfe3f5;position:relative}
.L-blue::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(#17406622 1px,transparent 1px),linear-gradient(90deg,#17406622 1px,transparent 1px);
  background-size:26px 26px}
.L-blue .cat{position:relative;font:600 11px/1 ui-monospace,monospace;letter-spacing:.22em;
  text-transform:uppercase;color:#4b9fe0;margin:28px 0 14px;display:flex}
.L-blue .cat:first-child{margin-top:0}
.L-blue .cat i{margin-left:auto;font-style:normal;color:#35618a}
.L-blue .row{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.L-blue .c{border:1px solid #1d4b73;background:rgba(12,32,52,.6);padding:15px}
.L-blue .c b{display:block;font:600 15px/1.3 ui-monospace,monospace;color:#eaf4ff;letter-spacing:-.01em}
.L-blue .c s{display:block;text-decoration:none;font-size:12.5px;color:#6d9cc4;margin-top:6px}
.L-blue .art{height:3px;background:#2a6ea8;margin-bottom:12px}

/* ═════ 4 SWISS ═════ */
.L-swiss{background:#f4f3f1;color:#0f0f0f}
.L-swiss .cat{font:700 12px/1 Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  border-top:2px solid #0f0f0f;padding-top:8px;margin:32px 0 14px;display:flex}
.L-swiss .cat:first-child{margin-top:0}
.L-swiss .cat i{margin-left:auto;font-style:normal;color:#d23b2e}
.L-swiss .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0;
  border-left:1px solid #d6d3ce}
.L-swiss .c{border-right:1px solid #d6d3ce;border-bottom:1px solid #d6d3ce;padding:16px 14px;min-height:118px}
.L-swiss .c b{display:block;font:700 18px/1.15 Helvetica,Arial,sans-serif;letter-spacing:-.025em}
.L-swiss .c s{display:block;text-decoration:none;font-size:12.5px;color:#55565a;margin-top:7px}
.L-swiss .c em{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#d23b2e}
.L-swiss .art{display:none}

/* ═════ 5 TERMINAL ═════ */
.L-term{background:#07090a;color:#c3d0c8;font-family:ui-monospace,"Ubuntu Mono",monospace}
.L-term .cat{font-size:12px;letter-spacing:.1em;color:#4ade80;margin:26px 0 10px}
.L-term .cat:first-child{margin-top:0}
.L-term .cat::before{content:'## '}
.L-term .cat i{font-style:normal;color:#44524a;margin-left:8px}
.L-term .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.L-term .c{border:1px solid #1a2320;background:#0c110f;padding:12px 14px}
.L-term .c b{display:block;font-size:14px;color:#e4efe8}
.L-term .c b::before{content:'> ';color:#4ade80}
.L-term .c s{display:block;text-decoration:none;font-size:12px;color:#5c6b63;margin-top:5px}
.L-term .c em{font-style:normal;font-size:10px;color:#4ade80}
.L-term .art{display:none}

/* ═════ 6 SHOWCASE ═════ */
.L-show{background:#101012;color:#f2f2f3}
.L-show .cat{font:600 11px/1 ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;
  color:#7a7a80;margin:30px 0 14px;display:flex;align-items:baseline}
.L-show .cat i{margin-left:auto;font-style:normal;letter-spacing:.06em;color:#4e4e55}
.L-show .cat:first-child{margin-top:0}
.L-show .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.L-show .c{border-radius:12px;overflow:hidden;background:#1a1a1d;position:relative}
.L-show .art{height:132px;background-size:cover;background-position:center;
  background-image:linear-gradient(160deg,hsl(var(--h) 38% 40%),hsl(calc(var(--h) + 40) 34% 22%))}
.L-show .c.has-img .art{background-image:var(--img);background-size:cover}
.L-show .meta{padding:13px 15px 16px}
.L-show .c b{display:block;font-size:17px;letter-spacing:-.025em}
.L-show .c s{display:block;text-decoration:none;font-size:12.5px;color:#9a9aa2;margin-top:4px}
.L-show .c em{font-style:normal;position:absolute;top:10px;right:10px;font:600 9.5px/1 ui-monospace,monospace;
  letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:999px}

@media(max-width:620px){.stage{padding:20px 16px 24px}.L-index .c b{font-size:21px}}
</style>
</head>
<body>
<div class="page">
  <h1>Six looks, your actual projects</h1>
  <p>Same three categories and six projects in each, so you're judging the look and nothing else.
     Say a number and I'll rebuild the site in it. Mixing is fine — "2 but dark", "4 with 6's images".</p>
  <div id="out"></div>
</div>

<script src="js/data.js"></script>
<script>
const LOOKS = [
  ['glass', 'Glass',     'what you have now'],
  ['index', 'Index',     'no cards — just type'],
  ['blue',  'Blueprint', 'engineering drawing'],
  ['swiss', 'Swiss',     'strict grid, one red'],
  ['term',  'Terminal',  'all monospace'],
  ['show',  'Showcase',  'image-led'],
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hueOf = id => { let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) % 100000; return 96 + (h % 124); };

document.getElementById('out').innerHTML = LOOKS.map(([k, name, why], i) => `
  <section class="look">
    <header><span class="n">${i+1}</span><b>${name}</b><span class="why">${why}</span></header>
    <div class="stage L-${k}">
      ${CATEGORIES.map(cat => {
        const items = PROJECTS.filter(p => p.category === cat.id);
        if (!items.length) return '';
        return `<div class="cat">${esc(cat.name)}<i>${items.length}</i></div>
          <div class="row">${items.map(p => `
            <div class="c${p.image ? ' has-img' : ''}" style="--h:${hueOf(p.id)}${p.image ? `;--img:url('${p.image}')` : ''}">
              <div class="art"></div>
              <div class="meta">
                <b>${esc(p.name)}</b>
                <s>${esc(p.tagline || p.tags.slice(0,3).join(' · '))}</s>
                <em>${esc(p.status)}</em>
              </div>
            </div>`).join('')}</div>`;
      }).join('')}
    </div>
  </section>`).join('');
</script>
</body>
</html>
